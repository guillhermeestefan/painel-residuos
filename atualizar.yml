name: Atualizar painel de residuos

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      desde:
        description: "Reprocessar TUDO desde esta data (dd/mm/aaaa). Deixe vazio para a rotina normal (ultimos 30 dias)."
        required: false
        default: ""
      obras:
        description: "Rodar apenas estas obras (nomes separados por virgula, ex.: Sumaré,Vila Nova). Vazio = todas."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Extrair CTRs do SP Regula
        env:
          SENHA_SPREGULA: ${{ secrets.SENHA_SPREGULA }}
          SENHAS_OBRAS: ${{ secrets.SENHAS_OBRAS }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          IN_DESDE: ${{ github.event.inputs.desde }}
          IN_OBRAS: ${{ github.event.inputs.obras }}
        run: |
          if [ -n "$IN_DESDE" ]; then DATEARG=(--desde "$IN_DESDE"); else DATEARG=(--dias 30); fi
          if [ -n "$IN_OBRAS" ]; then OBRASARG=(--obras "$IN_OBRAS"); else OBRASARG=(); fi
          echo "Rodando extrair_ctrs.py ${DATEARG[@]} ${OBRASARG[@]}"
          python extrair_ctrs.py "${DATEARG[@]}" "${OBRASARG[@]}"
      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dados_ctr.js base_consolidada.json base_consolidada.xlsx estado_extracao.json 2>/dev/null || true
          git commit -m "Atualiza dados CTR" || echo "sem mudancas"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push && break
            echo "push falhou (tentativa $i), o repositorio avancou; tentando de novo..."; sleep 5
          done
      - name: Extrair validades dos cadastros (SP Regula, semanal)
        env:
          SENHA_SPREGULA: ${{ secrets.SENHA_SPREGULA }}
          SENHAS_OBRAS: ${{ secrets.SENHAS_OBRAS }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          IN_OBRAS: ${{ github.event.inputs.obras }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%u)" = "1" ]; then
            if [ -n "$IN_OBRAS" ]; then python extrair_validades.py --obras "$IN_OBRAS" || echo "validade: etapa falhou, seguindo"; else python extrair_validades.py || echo "validade: etapa falhou, seguindo"; fi
          else
            echo "Validade so roda as segundas-feiras (ou em execucao manual). Pulando hoje."
          fi
      - name: Publicar validades
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add validades.json validades.js 2>/dev/null || true
          git commit -m "Atualiza validades dos cadastros" || echo "sem mudancas"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push && break
            echo "push falhou (tentativa $i); tentando de novo..."; sleep 5
          done
      - name: Notificar conformidade e custo (mensal, 2 etapas)
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python checar_conformidade.py
      - name: Salvar estado das notificacoes
        run: |
          git add estado_notificacoes.json 2>/dev/null || true
          git commit -m "Atualiza estado de notificacoes" || echo "sem mudancas"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push && break
            echo "push falhou (tentativa $i); tentando de novo..."; sleep 5
          done
